name: Build and Deploy Admin to AWS Amplify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-3
  APP_NAME: facejob-admin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: GitHubActionsAdminDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build Next.js
        env:
          NEXT_PUBLIC_BACKEND_URL: http://facejobalb-1619101788.eu-west-3.elb.amazonaws.com/api
          NEXT_PUBLIC_API_VERSION: v1
          NODE_ENV: production
        run: |
          npm install --legacy-peer-deps --include=dev
          npm run build

      - name: Package for Amplify SSR & Deploy
        run: |
          # 1. Récupérer l'App ID
          APP_ID=$(aws amplify list-apps --query "apps[?name=='$APP_NAME'].appId" --output text)
          echo "Amplify App ID : $APP_ID"

          # 2. Préparer la structure Amplify SSR
          rm -rf .amplify-hosting deploy.zip
          mkdir -p .amplify-hosting/compute/default
          mkdir -p .amplify-hosting/static/_next

          # Copier les fichiers serveur standalone
          cp -r .next/standalone/* .amplify-hosting/compute/default/
          cp -r .next/standalone/.next .amplify-hosting/compute/default/ 2>/dev/null || true

          # Copier les fichiers statiques et publics
          cp -r .next/static .amplify-hosting/static/_next/
          cp -r public/* .amplify-hosting/static/ 2>/dev/null || true
          cp -r public .amplify-hosting/compute/default/ 2>/dev/null || true

          # 3. Créer le manifest de routage Next.js SSR
          cat << 'EOF' > .amplify-hosting/deploy-manifest.json
          {
            "version": 1,
            "framework": { "name": "next", "version": "14.0.0" },
            "routes": [
              {
                "path": "/_next/static/*",
                "target": {
                  "kind": "Static",
                  "cacheControl": "public, max-age=31536000, immutable"
                }
              },
              {
                "path": "/*.*",
                "target": {
                  "kind": "Static"
                },
                "fallback": {
                  "kind": "Compute",
                  "src": "default"
                }
              },
              {
                "path": "/*",
                "target": {
                  "kind": "Compute",
                  "src": "default"
                }
              }
            ],
            "computeResources": [
              {
                "name": "default",
                "entrypoint": "server.js",
                "runtime": "nodejs20.x"
              }
            ]
          }
          EOF

          # 4. Créer l'archive zip finale
          cd .amplify-hosting
          zip -q -r ../deploy.zip .
          cd ..

          # 5. Déployer sur AWS Amplify
          DEPLOY_DATA=$(aws amplify create-deployment --app-id "$APP_ID" --branch-name main)
          JOB_ID=$(echo $DEPLOY_DATA | jq -r '.jobId')
          UPLOAD_URL=$(echo $DEPLOY_DATA | jq -r '.zipUploadUrl')

          curl -H "Content-Type: application/zip" -T deploy.zip "$UPLOAD_URL"
          aws amplify start-deployment --app-id "$APP_ID" --branch-name main --job-id "$JOB_ID"

          echo "✅ Déploiement SSR envoyé avec succès à Amplify !"
